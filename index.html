<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quiz · Equilibrio Químico y Lluvia Ácida 🐾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,800;1,9..144,400;1,9..144,500;1,9..144,600;1,9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0508;
    --bg-2: #110710;
    --surface: #1a0c14;
    --surface-2: #241019;
    --surface-3: #2e1623;
    --border: #3d1a2c;
    --border-strong: #5a2740;
    --text: #fff5f9;
    --text-dim: #c4a8b4;
    --text-mute: #7a5868;
    --pink: #ff5a9f;
    --pink-light: #ffb5d4;
    --pink-soft: #ff8bbb;
    --pink-deep: #c93b7c;
    --pink-glow: rgba(255,90,159,.18);
    --pink-faint: rgba(255,90,159,.08);
    --mint: #a5e6c7;
    --mint-soft: rgba(165,230,199,.10);
    --mint-border: rgba(165,230,199,.4);
    --coral: #ff7a8a;
    --coral-soft: rgba(255,122,138,.10);
    --coral-border: rgba(255,122,138,.4);
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(255,90,159,.12), transparent 60%),
      radial-gradient(ellipse 60% 50% at 100% 50%, rgba(201,59,124,.08), transparent 60%),
      radial-gradient(ellipse 60% 50% at 0% 100%, rgba(255,139,187,.06), transparent 60%);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app {
    max-width: 740px;
    margin: 0 auto;
    padding: 20px 20px 80px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  /* Decorative paws background */
  .paw-deco {
    position: fixed;
    color: var(--pink);
    opacity: .04;
    pointer-events: none;
    z-index: 0;
  }
  .paw-deco.p1 { top: 15%; left: -30px; transform: rotate(-20deg); }
  .paw-deco.p2 { top: 45%; right: -20px; transform: rotate(35deg); }
  .paw-deco.p3 { bottom: 20%; left: -10px; transform: rotate(15deg); }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    position: relative;
    z-index: 1;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-kitten {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    display: grid; place-items: center;
    box-shadow: 0 4px 16px rgba(255,90,159,.3), inset 0 1px 0 rgba(255,255,255,.15);
    flex-shrink: 0;
  }
  .brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }
  .brand-name {
    font-family: var(--serif);
    font-style: italic;
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -.01em;
  }
  .brand-sub {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-mute);
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .icon-btn:hover { color: var(--pink); border-color: var(--pink-deep); background: var(--pink-faint); }
  .icon-btn:active { transform: scale(.96); }
  .icon-btn.hidden { display: none; }

  /* PROGRESS */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
    position: relative;
    z-index: 1;
  }
  .progress-wrap.hidden { display: none; }
  .progress-track {
    flex: 1;
    height: 5px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--pink) 0%, var(--pink-light) 100%);
    border-radius: 999px;
    transition: width .5s cubic-bezier(.22,.61,.36,1);
    box-shadow: 0 0 14px rgba(255,90,159,.5);
  }
  .progress-text {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: .04em;
    white-space: nowrap;
  }
  .progress-text strong { color: var(--pink-light); font-weight: 500; }

  /* SHARED */
  .screen { animation: fadeUp .5s cubic-bezier(.22,.61,.36,1) both; position: relative; z-index: 1; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes float-y {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-3deg); }
    75% { transform: rotate(3deg); }
  }
  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    60% { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .15em;
    color: var(--pink);
    text-transform: uppercase;
    margin-bottom: 18px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .eyebrow::before {
    content: '';
    width: 18px;
    height: 1px;
    background: var(--pink);
  }

  /* WELCOME */
  .welcome { padding: 8px 0 0; }
  .welcome-hero {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin-bottom: 32px;
    position: relative;
  }
  .welcome-kitten {
    width: 130px;
    height: 130px;
    margin-bottom: 12px;
    animation: float-y 4s ease-in-out infinite;
    filter: drop-shadow(0 8px 24px rgba(255,90,159,.25));
  }
  .welcome h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(38px, 8vw, 58px);
    line-height: 1.0;
    letter-spacing: -.025em;
    margin-bottom: 20px;
  }
  .welcome h1 em {
    font-style: italic;
    font-weight: 500;
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-light) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .lede {
    font-size: 16.5px;
    color: var(--text-dim);
    max-width: 540px;
    margin-bottom: 36px;
    line-height: 1.55;
  }
  .lede strong { color: var(--text); font-weight: 600; }
  .lede .heart { color: var(--pink); display: inline-block; }

  /* MAIN CTA cards */
  .start-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 36px;
  }
  .start-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 20px;
    cursor: pointer;
    transition: all .25s ease;
    text-align: left;
    color: var(--text);
    font-family: var(--sans);
    position: relative;
    overflow: hidden;
  }
  .start-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--pink-deep), transparent);
    opacity: 0;
    transition: opacity .25s;
  }
  .start-card:hover {
    border-color: var(--pink-deep);
    background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(255,90,159,.15);
  }
  .start-card:hover::before { opacity: 1; }
  .start-card:active { transform: translateY(-1px); }
  .start-card.primary {
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    border-color: var(--pink);
    color: #1a0508;
    box-shadow: 0 8px 28px rgba(255,90,159,.3);
  }
  .start-card.primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 36px rgba(255,90,159,.45);
    background: linear-gradient(135deg, var(--pink-light) 0%, var(--pink) 100%);
  }
  .start-card-icon {
    width: 36px;
    height: 36px;
    margin-bottom: 14px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: var(--pink-faint);
    color: var(--pink);
  }
  .start-card.primary .start-card-icon {
    background: rgba(26,5,8,.18);
    color: #1a0508;
  }
  .start-card-title {
    font-family: var(--serif);
    font-style: italic;
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 4px;
    letter-spacing: -.01em;
  }
  .start-card-desc {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.45;
  }
  .start-card.primary .start-card-desc { color: rgba(26,5,8,.7); }
  .start-card-arrow {
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--pink);
  }
  .start-card.primary .start-card-arrow { color: #1a0508; }

  /* Meta info row */
  .meta-row {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    padding: 18px 0 4px;
    border-top: 1px dashed var(--border);
  }
  .meta-item { display: flex; flex-direction: column; gap: 2px; }
  .meta-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--text-mute);
    text-transform: uppercase;
  }
  .meta-value {
    font-family: var(--serif);
    font-style: italic;
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
  }
  .meta-value em { color: var(--pink); font-style: normal; font-weight: 600; }

  /* THEORY */
  .theory { padding: 4px 0; }
  .theory-header { margin-bottom: 28px; }
  .theory-header h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(30px, 6vw, 44px);
    line-height: 1.05;
    letter-spacing: -.02em;
    margin-bottom: 10px;
  }
  .theory-header h1 em {
    font-style: italic;
    color: var(--pink);
    font-weight: 500;
  }
  .theory-header p {
    color: var(--text-dim);
    font-size: 15px;
    max-width: 540px;
  }
  .topic-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 28px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .topic-chip {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 7px 12px;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all .18s ease;
    text-decoration: none;
    display: inline-block;
  }
  .topic-chip:hover {
    background: var(--pink-faint);
    color: var(--pink-light);
    border-color: var(--pink-deep);
  }
  .topic-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px 22px;
    margin-bottom: 16px;
    scroll-margin-top: 16px;
    position: relative;
  }
  .topic-card::before {
    content: '';
    position: absolute;
    left: 0; top: 24px; bottom: 24px;
    width: 3px;
    background: linear-gradient(180deg, var(--pink) 0%, var(--pink-deep) 100%);
    border-radius: 0 3px 3px 0;
  }
  .topic-num-tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--pink);
    letter-spacing: .12em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .topic-card h3 {
    font-family: var(--serif);
    font-style: italic;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: -.01em;
    margin-bottom: 18px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topic-card h4 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 15px;
    color: var(--pink-light);
    margin-bottom: 8px;
    margin-top: 18px;
    letter-spacing: -.005em;
  }
  .topic-card h4:first-of-type { margin-top: 0; }
  .topic-card p {
    color: var(--text-dim);
    font-size: 14.5px;
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .topic-card p strong { color: var(--text); font-weight: 600; }
  .topic-card ul {
    list-style: none;
    margin-bottom: 12px;
  }
  .topic-card li {
    color: var(--text-dim);
    font-size: 14.5px;
    line-height: 1.55;
    padding-left: 20px;
    position: relative;
    margin-bottom: 6px;
  }
  .topic-card li::before {
    content: '◦';
    position: absolute;
    left: 4px;
    top: 0;
    color: var(--pink);
    font-size: 16px;
    font-weight: 700;
  }
  .topic-card li strong { color: var(--text); font-weight: 600; }
  .chem, .topic-card code {
    font-family: var(--mono);
    font-size: .88em;
    background: var(--bg-2);
    padding: 2px 7px;
    border-radius: 5px;
    border: 1px solid var(--border);
    color: var(--pink-light);
    font-weight: 400;
    letter-spacing: 0;
    display: inline-block;
  }
  .formula-box {
    background: linear-gradient(135deg, var(--bg-2) 0%, var(--surface-2) 100%);
    border: 1px dashed var(--pink-deep);
    border-radius: 12px;
    padding: 14px 18px;
    margin: 12px 0;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--pink-light);
    text-align: center;
    letter-spacing: .02em;
  }
  .formula-box .formula-label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-mute);
    letter-spacing: .12em;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .example-box {
    background: var(--pink-faint);
    border-left: 2px solid var(--pink);
    padding: 12px 14px;
    margin: 12px 0;
    border-radius: 0 8px 8px 0;
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.5;
  }
  .example-box strong { color: var(--pink-light); font-weight: 600; }
  .kitten-note {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 14px;
    border: 1px solid var(--border);
  }
  .kitten-note-icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
  }
  .kitten-note-text {
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.5;
    font-style: italic;
  }
  .kitten-note-text strong { color: var(--pink-light); font-style: normal; font-weight: 600; }

  /* THEORY FOOTER CTA */
  .theory-cta {
    margin-top: 32px;
    padding: 28px 24px;
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--pink-deep);
    border-radius: 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .theory-cta::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, var(--pink-glow) 0%, transparent 50%);
    pointer-events: none;
  }
  .theory-cta-kitten {
    width: 80px;
    height: 80px;
    margin: 0 auto 14px;
    position: relative;
    animation: wiggle 3s ease-in-out infinite;
  }
  .theory-cta h3 {
    font-family: var(--serif);
    font-style: italic;
    font-size: 24px;
    font-weight: 500;
    margin-bottom: 8px;
    letter-spacing: -.01em;
    position: relative;
  }
  .theory-cta p {
    color: var(--text-dim);
    font-size: 14.5px;
    margin-bottom: 20px;
    position: relative;
  }

  /* BUTTONS */
  .btn-primary {
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    color: #1a0508;
    border: none;
    padding: 15px 26px;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -.005em;
    cursor: pointer;
    transition: all .2s ease;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(255,90,159,.35);
    position: relative;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,90,159,.5); }
  .btn-primary:active { transform: translateY(0) scale(.97); }
  .btn-primary svg { transition: transform .2s; }
  .btn-primary:hover svg { transform: translateX(3px); }
  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border-strong);
    padding: 15px 24px;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s ease;
  }
  .btn-secondary:hover { border-color: var(--pink); background: var(--pink-faint); color: var(--pink-light); }
  .btn-secondary:active { transform: scale(.97); }

  /* QUESTION */
  .question-wrap { padding: 4px 0; }
  .q-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-mute);
    letter-spacing: .12em;
    margin-bottom: 14px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .q-num strong { color: var(--pink); font-weight: 500; }
  .q-num .kitten-mini {
    width: 22px;
    height: 22px;
  }
  .question-text {
    font-family: var(--serif);
    font-size: clamp(22px, 4.5vw, 30px);
    font-weight: 400;
    line-height: 1.25;
    letter-spacing: -.01em;
    margin-bottom: 28px;
    color: var(--text);
  }
  .question-text em { font-style: italic; color: var(--pink-light); }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 22px;
  }
  .option {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    text-align: left;
    cursor: pointer;
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.4;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: all .18s ease;
    position: relative;
    width: 100%;
  }
  .option:hover:not(:disabled) {
    border-color: var(--pink-deep);
    background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 100%);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(255,90,159,.1);
  }
  .option:active:not(:disabled) { transform: translateY(0) scale(.99); }
  .option:disabled { cursor: default; }
  .opt-letter {
    width: 30px; height: 30px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: grid; place-items: center;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    flex-shrink: 0;
    transition: all .18s ease;
  }
  .option:hover:not(:disabled) .opt-letter {
    color: var(--pink-light);
    border-color: var(--pink-deep);
    background: var(--pink-faint);
  }
  .opt-text { padding-top: 4px; flex: 1; }
  .option.correct {
    border-color: var(--mint-border);
    background: var(--mint-soft);
    animation: pulseCorrect .4s ease;
  }
  .option.correct .opt-letter {
    background: var(--mint);
    color: #0a0508;
    border-color: var(--mint);
  }
  .option.wrong {
    border-color: var(--coral-border);
    background: var(--coral-soft);
    animation: shake .35s ease;
  }
  .option.wrong .opt-letter {
    background: var(--coral);
    color: #1a0506;
    border-color: var(--coral);
  }
  .option.dimmed { opacity: .4; }
  @keyframes pulseCorrect {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.015); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  /* FEEDBACK */
  .feedback {
    margin-top: 8px;
    padding: 18px 20px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--bg-2);
    animation: fadeUp .4s cubic-bezier(.22,.61,.36,1) both;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .feedback.correct { border-color: var(--mint-border); background: var(--mint-soft); }
  .feedback.wrong { border-color: var(--coral-border); background: var(--coral-soft); }
  .fb-kitten {
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    animation: pop .5s cubic-bezier(.22,.61,.36,1) both;
  }
  .fb-content { flex: 1; min-width: 0; }
  .fb-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 19px;
    font-weight: 500;
  }
  .feedback.correct .fb-head { color: var(--mint); }
  .feedback.wrong .fb-head { color: var(--coral); }
  .fb-body {
    color: var(--text);
    font-size: 14.5px;
    line-height: 1.6;
  }
  .fb-body strong { color: var(--text); font-weight: 600; }
  .fb-body .chem {
    background: rgba(255,255,255,.04);
    color: var(--pink-light);
  }
  .next-wrap {
    margin-top: 22px;
    display: flex;
    justify-content: flex-end;
  }

  /* END SCREEN */
  .end { padding: 12px 0; text-align: center; }
  .end-kitten {
    width: 130px;
    height: 130px;
    margin: 0 auto 8px;
    animation: pop .6s cubic-bezier(.22,.61,.36,1) both, float-y 4s ease-in-out 0.6s infinite;
    filter: drop-shadow(0 8px 24px rgba(255,90,159,.3));
  }
  .score-ring {
    width: 180px; height: 180px;
    margin: 0 auto 28px;
    position: relative;
  }
  .score-ring svg {
    transform: rotate(-90deg);
    width: 100%;
    height: 100%;
  }
  .score-ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 9; }
  .score-ring-fg {
    fill: none;
    stroke: url(#pinkGrad);
    stroke-width: 9;
    stroke-linecap: round;
    transition: stroke-dashoffset 1.6s cubic-bezier(.22,.61,.36,1);
    filter: drop-shadow(0 0 10px rgba(255,90,159,.5));
  }
  .score-num {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
  }
  .score-num-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .score-big {
    font-family: var(--serif);
    font-style: italic;
    font-size: 54px;
    font-weight: 500;
    letter-spacing: -.03em;
    line-height: 1;
  }
  .score-big em { font-style: italic; color: var(--pink); font-weight: 600; }
  .score-pct {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 6px;
    letter-spacing: .08em;
  }
  .end h2 {
    font-family: var(--serif);
    font-size: clamp(28px, 5vw, 36px);
    font-weight: 400;
    margin-bottom: 12px;
    letter-spacing: -.015em;
  }
  .end h2 em {
    font-style: italic;
    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-light) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 500;
  }
  .end-msg {
    color: var(--text-dim);
    font-size: 16px;
    max-width: 460px;
    margin: 0 auto 32px;
    line-height: 1.6;
  }
  .end-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .review {
    margin-top: 44px;
    text-align: left;
    border-top: 1px solid var(--border);
    padding-top: 28px;
  }
  .review h3 {
    font-family: var(--serif);
    font-style: italic;
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 16px;
    letter-spacing: -.01em;
  }
  .review-item {
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 8px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    font-size: 14px;
    background: var(--surface);
  }
  .review-mark {
    width: 26px; height: 26px;
    border-radius: 50%;
    display: grid; place-items: center;
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 700;
  }
  .review-mark.ok { background: var(--mint); color: #0a0508; }
  .review-mark.no { background: var(--coral); color: #1a0506; }
  .review-q {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-mute);
    margin-bottom: 4px;
    letter-spacing: .08em;
  }
  .review-text { color: var(--text-dim); line-height: 1.45; }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,5,8,.78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    animation: fadeIn .2s ease both;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 22px;
    padding: 28px;
    max-width: 380px;
    width: 100%;
    animation: fadeUp .25s ease both;
    text-align: center;
  }
  .modal-kitten {
    width: 64px;
    height: 64px;
    margin: 0 auto 12px;

  .modal h3 {

    font-style: italic;
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 8px;
    letter-spacing: -.01em;

  .modal p { color: var(--text-dim); font-size: 14.5px; margin-bottom: 22px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 10px; justify-content: center; }
  .modal-actions button {
    padding: 11px 20px;
    border-radius: 999px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border-strong);
    background: transparent;
    color: var(--text);
    transition: all .15s ease;

  .modal-actions button:hover { background: var(--surface-2); }
  .modal-actions .danger {

    color: #1a0508;
    font-weight: 700;
  }
  .modal-actions .danger:hover { box-shadow: 0 6px 18px rgba(255,90,159,.35); }

  .footer-credit {
    margin-top: auto;
    padding-top: 36px;
    text-align: center;
    font-size: 10.5px;
    color: var(--text-mute);
    font-family: var(--mono);
    letter-spacing: .08em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .footer-credit .heart-mini { color: var(--pink); }

  .hidden { display: none !important; }
  @media (max-width: 480px) {
    .app { padding: 14px 14px 60px; }
    .header { padding-bottom: 18px; margin-bottom: 18px; }
    .brand-name { font-size: 15px; }
    .start-cards { grid-template-columns: 1fr; gap: 10px; }
    .meta-row { gap: 14px; }
    .meta-value { font-size: 16px; }
    .feedback { padding: 14px 16px; gap: 10px; }
    .fb-kitten { width: 44px; height: 44px; }
    .option { padding: 14px 14px; font-size: 14.5px; }

    .topic-card h3 { font-size: 22px; }
    .welcome-kitten { width: 110px; height: 110px; }
    .end-kitten { width: 110px; height: 110px; }
  }
</style>
</head>

function render() {
  if (state.screen === 'welcome') {
    resetBtn.classList.add('hidden');
    homeBtn.classList.add('hidden');
    progressWrap.classList.add('hidden');
    renderWelcome();
  } else if (state.screen === 'theory') {
    resetBtn.classList.add('hidden');
    homeBtn.classList.remove('hidden');
    progressWrap.classList.add('hidden');
    renderTheory();
  } else if (state.screen === 'quiz') {
    resetBtn.classList.remove('hidden');
    homeBtn.classList.add('hidden');
    progressWrap.classList.remove('hidden');
    updateProgress();
    renderQuestion();
  } else if (state.screen === 'end') {
    resetBtn.classList.remove('hidden');
    homeBtn.classList.remove('hidden');
    progressWrap.classList.add('hidden');
    renderEnd();
  }
  window.scrollTo({top: 0, behavior: 'smooth'});
}

        <button class="btn-primary" id="theoryToQuiz" type="button">
          Comenzar quiz
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    </section>
  `;

  document.getElementById('theoryToQuiz').addEventListener('click', startQuiz);
  // Smooth scroll for topic chips
  main.querySelectorAll('.topic-chip').forEach(chip => {
    chip.addEventListener('click', (e) => {
      e.preventDefault();
      const id = chip.getAttribute('href').slice(1);
      document.getElementById(id)?.scrollIntoView({behavior: 'smooth', block: 'start'});
    });
  });
}

function renderQuestion() {
  const i = state.currentIndex;
  const q = QUESTIONS[i];
  const userAns = state.answers[i];
  const answered = userAns !== undefined && userAns !== null;

  let optsHTML = q.opts.map((opt, idx) => {
    const letter = ['A','B','C','D'][idx];
    let cls = 'option';
    if (answered) {
      if (idx === q.correct) cls += ' correct';
      else if (idx === userAns) cls += ' wrong';
      else cls += ' dimmed';
    }
    return `<button class="${cls}" data-idx="${idx}" ${answered ? 'disabled' : ''} type="button">
      <span class="opt-letter">${letter}</span>
      <span class="opt-text">${opt}</span>
    </button>`;
  }).join('');

  let feedbackHTML = '';
  let nextHTML = '';
  if (answered) {
    const isCorrect = userAns === q.correct;
    feedbackHTML = `
      <div class="feedback ${isCorrect ? 'correct' : 'wrong'}">
        <svg class="fb-kitten" viewBox="0 0 80 80">
          <use href="${isCorrect ? '#kittenHappy' : '#kittenSad'}"/>
        </svg>
        <div class="fb-content">
          <div class="fb-head">
            ${isCorrect ? '¡Correctísimo!' : 'Casi… pero no'}
          </div>
          <div class="fb-body">${q.explain}</div>
        </div>
      </div>
    `;
    const isLast = i === QUESTIONS.length - 1;
    nextHTML = `
      <div class="next-wrap">
        <button class="btn-primary" id="nextBtn" type="button">
          ${isLast ? 'Ver resultados' : 'Siguiente'}
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    `;
  }

  main.innerHTML = `
    <section class="screen question-wrap">
      <div class="q-num">
        <svg class="kitten-mini" viewBox="0 0 40 40"><use href="#kittenMini"/></svg>
        Pregunta <strong>${i+1}</strong> · de ${QUESTIONS.length}
      </div>
      <h2 class="question-text">${q.q}</h2>
      <div class="options">${optsHTML}</div>
      ${feedbackHTML}
      ${nextHTML}
    </section>
  `;

  if (!answered) {
    main.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx);
        state.answers[i] = idx;
        renderQuestion();
      });
    });
  } else {
    document.getElementById('nextBtn').addEventListener('click', () => {
      if (i === QUESTIONS.length - 1) {
        state.screen = 'end';
      } else {
        state.currentIndex++;
      }
      render();
    });
  }
}

function renderEnd() {
  const total = QUESTIONS.length;
  const correct = state.answers.reduce((acc, a, i) => acc + (a === QUESTIONS[i].correct ? 1 : 0), 0);
  const pct = Math.round((correct/total) * 100);

  const useGoodKitten = pct >= 70;
  const kittenSym = useGoodKitten ? '#kittenWin' : '#kittenComfort';

  let msg = '';
  if (pct === 100) msg = '¡PERFECTO! Llegas al control con todo dominado. Date un gusto. 💖';
  else if (pct >= 85) msg = 'Excelente nivel. Conceptos sólidos. Repasa lo poquito que falló y vas más que lista.';
  else if (pct >= 70) msg = 'Vas bien. Identifica los temas donde te equivocaste, vuelve a la teoría y dale otra vuelta al quiz.';
  else if (pct >= 50) msg = 'A medio camino. Hay temas claros, otros para repasar. Lee las explicaciones y vuelve a la teoría — vas a llegar.';
  else msg = 'Sin pánico. Justo para esto es estudiar: para equivocarse aquí y no en el control. Repasa la teoría con calma y reintenta. 🐾';

  const r = 80;
  const c = 2 * Math.PI * r;
  const dash = c * (pct/100);

  let reviewHTML = state.answers.map((ans, i) => {
    const isOk = ans === QUESTIONS[i].correct;
    return `<div class="review-item">
      <div class="review-mark ${isOk ? 'ok' : 'no'}">${isOk ? '✓' : '✗'}</div>
      <div>
        <div class="review-q">Pregunta ${i+1}</div>
        <div class="review-text">${stripHTML(QUESTIONS[i].q).substring(0, 110)}${stripHTML(QUESTIONS[i].q).length > 110 ? '…' : ''}</div>
      </div>
    </div>`;
  }).join('');

  main.innerHTML = `
    <section class="screen end">
      <svg class="end-kitten" viewBox="0 0 140 140"><use href="${kittenSym}"/></svg>
      <div class="score-ring">
        <svg viewBox="0 0 180 180">
          <defs>
            <linearGradient id="pinkGradEnd" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ff5a9f"/>
              <stop offset="100%" stop-color="#ffb5d4"/>
            </linearGradient>
          </defs>
          <circle class="score-ring-bg" cx="90" cy="90" r="${r}"/>
          <circle class="score-ring-fg" cx="90" cy="90" r="${r}"
            stroke="url(#pinkGradEnd)"
            stroke-dasharray="${c}"
            stroke-dashoffset="${c}"
            id="ringFg"/>
        </svg>
        <div class="score-num">
          <div class="score-num-inner">
            <div class="score-big"><em>${correct}</em>/${total}</div>
            <div class="score-pct">${pct}% CORRECTO</div>
          </div>
        </div>
      </div>
      <h2>${pct >= 70 ? '<em>¡Bien hecho!</em>' : 'Resultado'}</h2>
      <p class="end-msg">${msg}</p>
      <div class="end-actions">
        <button class="btn-primary" id="restartBtn" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          Reintentar quiz
        </button>
        <button class="btn-secondary" id="reviewBtn" type="button">Ver desglose</button>
      </div>
      <div class="review hidden" id="reviewSection">
        <h3>Desglose de respuestas</h3>
        ${reviewHTML}
      </div>
    </section>
  `;

  requestAnimationFrame(() => {
    const ring = document.getElementById('ringFg');
    ring.style.strokeDashoffset = (c - dash) + '';
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    state = { screen: 'welcome', currentIndex: 0, answers: [] };
    render();
  });
  document.getElementById('reviewBtn').addEventListener('click', () => {
    const section = document.getElementById('reviewSection');
    section.classList.toggle('hidden');
    if (!section.classList.contains('hidden')) {
      section.scrollIntoView({behavior: 'smooth', block: 'start'});
    }
  });
}

function stripHTML(s) {
  const tmp = document.createElement('div');
  tmp.innerHTML = s;
  return tmp.textContent || tmp.innerText || '';
}

function updateProgress() {
  const total = QUESTIONS.length;
  const current = state.currentIndex + 1;
  const answered = state.answers.filter(a => a !== undefined && a !== null).length;
  const pct = (answered / total) * 100;
  progressBar.style.width = pct + '%';
  qCurrent.textContent = current;
}

function startQuiz() {
  state = { screen: 'quiz', currentIndex: 0, answers: [] };
  render();
}

function goHome() {
  state = { screen: 'welcome', currentIndex: 0, answers: [] };
  render();
}

resetBtn.addEventListener('click', () => modal.classList.add('active'));
homeBtn.addEventListener('click', goHome);
modalCancel.addEventListener('click', () => modal.classList.remove('active'));
modalConfirm.addEventListener('click', () => {
  modal.classList.remove('active');
  goHome();
});
modal.addEventListener('click', (e) => {
  if (e.target === modal) modal.classList.remove('active');
});

document.addEventListener('keydown', (e) => {
  if (state.screen === 'quiz') {
    const userAns = state.answers[state.currentIndex];
    const answered = userAns !== undefined && userAns !== null;
    if (!answered) {
      const key = e.key.toUpperCase();
      const letterIdx = ['A','B','C','D'].indexOf(key);
      if (letterIdx >= 0 && letterIdx < QUESTIONS[state.currentIndex].opts.length) {
        state.answers[state.currentIndex] = letterIdx;
        renderQuestion();
      }
    } else {
      if (e.key === 'Enter' || e.key === 'ArrowRight') {
        if (state.currentIndex === QUESTIONS.length - 1) state.screen = 'end';
        else state.currentIndex++;
        render();
      }
    }
  }
});

render();
</script>
</body>
</html>
